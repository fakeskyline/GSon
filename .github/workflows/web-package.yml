name: Package GSon Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package web application
        run: |
          test -f fonts/nunito.ttf
          zip -qr GSon-Web.zip index.html styles.css app.js manifest.webmanifest sw.js vendor fonts README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: GSon-Web
          path: GSon-Web.zip
          retention-days: 30
