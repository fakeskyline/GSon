name: Package GSon Web
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble standalone web package
        run: |
          mkdir -p package
          cp -R web/. package/
          cd package
          zip -qr ../GSon-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: GSon-Web-Full
          path: GSon-Web.zip
          retention-days: 30
